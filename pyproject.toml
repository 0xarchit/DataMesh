[project]
name = "datamesh-ai"
version = "0.1.0"
description = "Evidence-aware multimodal enterprise data consolidation"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "pypdf",
    "pillow",
    "reportlab",
    "requests",
    "openai",
    "scikit-learn",
    "matplotlib",
    "streamlit",
    "chromadb",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["datamesh", "datamesh.core", "datamesh.ingestion", "datamesh.evidence", "datamesh.reconciliation", "datamesh.fusion", "datamesh.rag"]
